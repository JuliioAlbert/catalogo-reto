<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Catálogo de Productos</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; }
    .msg { margin: 0.5rem 0; padding: 0.5rem; border-radius: 6px; }
    .user { background: #e8f0fe; }
    .assistant { background: #f1f3f4; }
    .tools { font-size: 0.8rem; color: #555; }
    .error { background: #fde8e8; }
  </style>
</head>
<body>
  <h1>Catálogo de Productos</h1>
  <div data-testid="answer" id="conversation"></div>
  <div class="tools" id="request-id" data-testid="request-id"></div>
  <form id="form">
    <input data-testid="api-key" id="api-key" type="password" size="30"
           autocomplete="off" placeholder="Clave de acceso">
    <br>
    <input data-testid="question" id="question" type="text" size="50"
           placeholder="Pregunta por un producto o una categoría">
    <button data-testid="send" id="send" type="submit">Enviar</button>
  </form>
  <script>
    const history = [];
    const conversation = document.getElementById("conversation");
    const input = document.getElementById("question");
    const keyInput = document.getElementById("api-key");
    // La clave solo vive en sessionStorage: se pierde al cerrar la pestaña.
    keyInput.value = sessionStorage.getItem("catalog-api-key") || "";
    keyInput.addEventListener("input", () => {
      sessionStorage.setItem("catalog-api-key", keyInput.value);
    });

    function addMessage(kind, text, tools) {
      const box = document.createElement("div");
      box.className = "msg " + kind;
      const body = document.createElement("div");
      body.textContent = text;
      box.appendChild(body);
      if (tools && tools.length) {
        const info = document.createElement("div");
        info.className = "tools";
        info.textContent = "Herramientas usadas: " + tools.join(", ");
        box.appendChild(info);
      }
      conversation.appendChild(box);
    }

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) {
        addMessage("error", "Escribe una pregunta.");
        return;
      }
      addMessage("user", question);
      input.value = "";
      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": keyInput.value,
          },
          body: JSON.stringify({question: question, history: history}),
        });
        if (response.status === 401) {
          addMessage("error", "Clave inválida");
          return;
        }
        if (response.status === 429) {
          const seconds = response.headers.get("Retry-After") || "unos";
          addMessage("error", "Demasiadas preguntas; espera " + seconds
            + " segundos");
          return;
        }
        if (!response.ok) {
          addMessage("error", "No se pudo obtener la respuesta (error "
            + response.status + "). Revisa tu pregunta e intenta de nuevo.");
          return;
        }
        const data = await response.json();
        addMessage("assistant", data.answer, data.tools_used);
        // request_id: id de la petición, útil para rastrearla en el log
        document.getElementById("request-id").textContent =
          "Petición: " + data.request_id;
        history.push({role: "user", content: question});
        history.push({role: "assistant", content: data.answer});
      } catch (error) {
        addMessage("error", "No hay conexión con el servicio. Intenta de nuevo.");
      }
    });
  </script>
</body>
</html>
